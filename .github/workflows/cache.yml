name: cache-ff-data

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Traer datos
        run: node scripts/fetch.mjs
        env:
          UA: FFToolkit/1.0 (+https://github.com/${{ github.repository }})
          FF_KEY: ${{ secrets.FF_KEY }}
      - name: Guardar en el repo
        run: |
          git config user.name "ff-cache"
          git config user.email "actions@users.noreply.github.com"
          git add data/cache.json
          git diff --quiet --cached || git commit -m "update cache"
          git push
